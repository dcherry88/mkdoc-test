name: Deploy mkdocs site to GitHub Pages

on:
  push:
    branches: [master]
  gollum: # fires on wiki page create/update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Content lives in the wiki repo, not this one.
      - name: Checkout wiki content
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r .mkdocs/requirements.txt

      # mkdocs forbids site_dir living inside docs_dir, so build to an
      # explicit path outside both checkouts.
      - name: Build site
        run: mkdocs build -f .mkdocs/mkdocs.yml --strict --site-dir /tmp/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
