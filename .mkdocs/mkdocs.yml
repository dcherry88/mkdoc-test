site_name: Obsidian Test Vault
site_url: https://dcherry88.github.io/mkdoc-test/
repo_url: https://github.com/dcherry88/mkdoc-test
repo_name: dcherry88/mkdoc-test

# Content now lives in the separate GitHub wiki repo
# (dcherry88/mkdoc-test.wiki), checked out into ./wiki at build time.
# This repo only holds the mkdocs tooling.
docs_dir: ../wiki
site_dir: ../../site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - awesome-pages
  - roamlinks
  - redirects:
      redirect_maps:
        index.md: Home.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
