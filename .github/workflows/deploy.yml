name: Deploy mkdocs site to GitHub Pages

on:
  push:
    branches: [content-poc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r .mkdocs/requirements.txt

      # mkdocs forbids site_dir living inside docs_dir, and docs_dir here
      # is the repo root, so build to an explicit path outside the checkout.
      - name: Build site
        run: mkdocs build -f .mkdocs/mkdocs.yml --strict --site-dir /tmp/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
