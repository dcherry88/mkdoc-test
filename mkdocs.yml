site_name: Obsidian Test Vault
site_url: https://dcherry88.github.io/mkdoc-test/
repo_url: https://github.com/dcherry88/mkdoc-test
repo_name: dcherry88/mkdoc-test

# Serve the vault's own root as the doc source, so nothing has to move
# out of its Obsidian folder structure to be published.
docs_dir: .
site_dir: ../site
use_directory_urls: true

# Files that live in the vault root for tooling purposes only, not content.
exclude_docs: |
  mkdocs.yml
  requirements.txt

theme:
  name: material
  features:
    - navigation.instant
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - awesome-pages
  - roamlinks

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
