name: Quartz POC build and deploy

# Side-by-side comparison POC against the same wiki content used by the
# mkdocs build on master. Deploys to the SAME Pages site, so while this
# is live it temporarily replaces the mkdocs-built output until master
# (or another branch allowed to deploy) runs again.

on:
  push:
    branches: [quartz-poc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Content lives in the wiki repo, same source the mkdocs build uses.
      - name: Checkout wiki content
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Copy wiki content into Quartz content dir
        run: |
          rm -rf .quartz/content
          mkdir -p .quartz/content
          rsync -a --exclude='.git' --exclude='.obsidian' --exclude='.gitignore' --exclude='.gitattributes' wiki/ .quartz/content/
          # Quartz's home page must be content/index.md; the vault's home
          # note is Home.md, so mirror it at build time without touching
          # the actual wiki content.
          cp .quartz/content/Home.md .quartz/content/index.md

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: .quartz
        run: npm ci

      - name: Build site
        working-directory: .quartz
        run: node quartz/bootstrap-cli.mjs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
